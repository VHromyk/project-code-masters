<link rel="stylesheet" href="./css/popup.css" />
<link rel="stylesheet" href="./css/star-rating.css" />

<!--POPUPS-->
<div class="popup-backdrop" data-popup-backdrop data-popup-close>
  <!--exercise-popup-->
  <div class="popup" data-popup id="exercise-popup">
    <button
      type="button"
      class="popup-close"
      aria-label="close popup window"
      data-popup-close
    >
      <svg><use href="./img/sprite.svg#close-popup"></use></svg>
    </button>

    <div class="popup-content" data-exercise-content></div>
  </div>

  <!--exercise-popup-->
  <div class="popup medium pending" data-popup id="add-rating-popup">
    <button
      type="button"
      class="popup-close"
      aria-label="close popup window"
      data-popup-close
    >
      <svg><use href="./img/sprite.svg#close-popup"></use></svg>
    </button>
  </div>
</div>
