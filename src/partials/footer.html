<link rel="stylesheet" href="./css/footer.css" />
<footer class="footer">
  <div class="container footer__container">
    <div class="footer__brand">
      <a href="./index.html" class="footer__logo" aria-label="Your Energy Home">
        <svg class="footer__logo-icon" width="132" height="24" aria-hidden="true">
          <use href="./img/sprite.svg#logo"></use>
        </svg>
      </a>

      <ul class="footer__socials">
        <li>
          <a href="https://www.facebook.com/goITclub/" class="footer__social-link" aria-label="Facebook" target="_blank" rel="noopener noreferrer">
            <svg class="footer__social-icon" width="28" height="28" aria-hidden="true">
              <use href="./img/sprite.svg#facebook"></use>
            </svg>
          </a>
        </li>
        <li>
          <a href="https://www.instagram.com/goitclub/" class="footer__social-link" aria-label="Instagram" target="_blank" rel="noopener noreferrer">
            <svg class="footer__social-icon" width="28" height="28" aria-hidden="true">
              <use href="./img/sprite.svg#instagram"></use>
            </svg>
          </a>
        </li>
        <li>
          <a href="https://www.youtube.com/c/GoIT" class="footer__social-link" aria-label="YouTube" target="_blank" rel="noopener noreferrer">
            <svg class="footer__social-icon" width="28" height="28" aria-hidden="true">
              <use href="./img/sprite.svg#youtube"></use>
            </svg>
          </a>
        </li>
      </ul>
    </div>

    <h2 class="footer__title">Transforming your <em>body</em> shape with us</h2>

    <form class="footer__form" name="subscription">
      <label class="footer__form-label" for="footer-email">Subscribe and learn about new exercises!</label>
      <input
        class="footer__input"
        type="email"
        id="footer-email"
        name="email"
        placeholder="Email"
        autocomplete="email"
        pattern="^\w+(\.\w+)?@[a-zA-Z_]+?\.[a-zA-Z]{2,3}$"
        title="Enter a valid email"
        required
      />
      <button class="footer__button" type="submit">Send</button>
      <p class="footer__form-message" data-subscription-message aria-live="polite"></p>
    </form>

    <p class="footer__copyright">Your Energy. All rights reserved.</p>

    <ul class="footer__legal">
      <li><a href="#" class="footer__legal-link">Privacy Policy</a></li>
      <li class="footer__legal-divider" aria-hidden="true">/</li>
      <li><a href="#" class="footer__legal-link">Terms of Service</a></li>
    </ul>

    <p class="footer__year">©2026</p>
  </div>
</footer>
