<link rel="stylesheet" href="./css/hero.css" />
<section class="hero container">
  <div class="hero__container">
    <div class="hero-content-container">
      <div class="hero-copy">
        <h1 class="hero-title">
          <svg class="hero__star-icon" aria-hidden="true">
            <use href="./img/sprite.svg#star"></use>
          </svg>
          Get <span>body</span> in <br />
          shape, Stay healthy
        </h1>
        <p class="hero-subtitle">
          Transform your physique and embrace a healthier lifestyle with our
          comprehensive fitness and nutrition support.
        </p>
      </div>
      <div class="hero-yoga-container">
        <picture>
          <source
            media="(min-width: 1440px)"
            srcset="
              ./img/hero/hero-sub-img.jpg    1x,
              ./img/hero/hero-sub-img@2x.jpg 2x
            "
          />

          <img
            class="hero-yoga-img"
            src="./img/hero/hero-sub-img.jpg"
            alt="women in sportswear working out outdoors"
          />
        </picture>
        <ul class="yoga-hashtag-list">
          <li class="hashtag-list-item">#Sport</li>
          <li class="hashtag-list-item">#Healthy</li>
          <li class="hashtag-list-item">#Workout</li>
          <li class="hashtag-list-item">#Diet</li>
        </ul>
      </div>
    </div>
    <picture>
      <source
        media="(min-width: 1440px)"
        srcset="./img/hero/hero-img.jpg 1x, ./img/hero/hero-img@2x.jpg 2x"
      />

      <source
        media="(min-width: 768px)"
        srcset="
          ./img/hero/hero-img-tab.jpg    1x,
          ./img/hero/hero-img-tab@2x.jpg 2x
        "
      />

      <source
        srcset="
          ./img/hero/hero-img-mob.jpg    1x,
          ./img/hero/hero-img-mob@2x.jpg 2x
        "
      />

      <img
        class="hero-img"
        src="./img/hero/hero-img-mob.jpg"
        alt="women in sportswear working out outdoors"
        fetchpriority="high"
      />
    </picture>
    <ul class="hashtag-list">
      <li class="hashtag-list-item">#Sport</li>
      <li class="hashtag-list-item">#Healthy</li>
      <li class="hashtag-list-item">#Workout</li>
      <li class="hashtag-list-item">#Diet</li>
    </ul>
  </div>
</section>
