<link rel="stylesheet" href="./css/filters-block.css" />
<div id="filters-block" class="container filters-block">
  <div class="filters-block-header-wrapper">
    <h2 class="filters-block-header">
      Exercises<span class="exercises-page-element"> /</span>
    </h2>
    <h3 class="filters-block-subheader exercises-page-element">Waist</h3>
  </div>
  <div class="filters-block-wrapper">
    <div class="filters-block-input-wrapper exercises-page-element">
      <input class="filters-block-input" type="text" placeholder="Search" />
      <button class="filters-block-input-button" type="button">
        <svg class="filters-block-input-icon" width="18" height="18">
          <use href="../img/icons.svg#icon-search" />
        </svg>
      </button>
    </div>
    <ul class="filters-block-list">
      <li>
        <button
          class="filters-block-list-button current"
          type="button"
          data-filter="Muscles"
        >
          <span>Muscles</span>
        </button>
      </li>
      <li>
        <button
          class="filters-block-list-button"
          type="button"
          data-filter="Body parts"
        >
          <span>Body parts</span>
        </button>
      </li>
      <li>
        <button
          class="filters-block-list-button"
          type="button"
          data-filter="Equipment"
        >
          <span>Equipment</span>
        </button>
      </li>
    </ul>
  </div>
</div>
