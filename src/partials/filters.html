<div id="filters-block" class="filters-block" data-state="categories">
  <div class="filters-block-header-wrapper">
    <h2 class="filters-block-header">
      <button class="filters-block-home" type="button">
        Exercises
      </button>
      <span> /</span>
    </h2>
    <h3 class="filters-block-subheader">Waist</h3>
  </div>
  <form class="filters-block-form">
    <div class="filters-block-search-input-wrapper">
      <input class="filters-block-search-input" type="text" name="search" placeholder="Search" />
      <button class="filters-block-search-input-button" type="submit" aria-label="Search">
        <svg class="filters-search-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="1.5" aria-hidden="true">
          <circle cx="10.5" cy="10.5" r="6.5"></circle>
          <path d="m16 16 5 5"></path>
        </svg>

        <svg class="filters-clear-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="1.5" aria-hidden="true" hidden>
          <path d="m6 6 12 12M18 6 6 18"></path>
        </svg>
      </button>
    </div>
    <ul class="filters-block-list">
      <li>
        <button class="filters-block-list-button current" type="button" data-filter="Muscles">
          <span>Muscles</span>
        </button>
      </li>
      <li>
        <button class="filters-block-list-button" type="button" data-filter="Body parts">
          <span>Body parts</span>
        </button>
      </li>
      <li>
        <button class="filters-block-list-button" type="button" data-filter="Equipment">
          <span>Equipment</span>
        </button>
      </li>
    </ul>
    <input class="filters-block-filter-input" type="hidden" name="filter" value="Muscles" />
    <input class="filters-block-category-input" type="hidden" name="category" value="" />
  </form>
</div>
