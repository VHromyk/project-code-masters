<section class="categories container" aria-labelledby="categories-title">
  <div class="categories-header">
    <h2 class="categories-title" id="categories-title">
      <button class="categories-home" type="button">
        Exercises
      </button>

      <span class="categories-breadcrumb" hidden>
        <span class="categories-slash">/</span>
        <span class="categories-selected"></span>
      </span>
    </h2>

    <div class="categories-controls">
      <form class="categories-search" role="search" hidden>
        <input class="categories-search-input" type="search" name="keyword" placeholder="Search"
          aria-label="Search exercises in selected category" maxlength="100" />

        <button class="categories-search-button" type="button" aria-label="Search">
          <svg class="search-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
            stroke-width="1.5" aria-hidden="true">
            <circle cx="10.5" cy="10.5" r="6.5"></circle>
            <path d="m16 16 5 5"></path>
          </svg>

          <svg class="search-clear-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
            stroke-width="1.5" aria-hidden="true" hidden>
            <path d="m6 6 12 12M18 6 6 18"></path>
          </svg>
        </button>
      </form>

      <div class="categories-filters" role="group" aria-label="Filter exercise categories">
        <button class="categories-filter is-active" type="button" data-filter="Muscles" aria-pressed="true">
          Muscles
        </button>

        <button class="categories-filter" type="button" data-filter="Body parts" aria-pressed="false">
          Body parts
        </button>

        <button class="categories-filter" type="button" data-filter="Equipment" aria-pressed="false">
          Equipment
        </button>
      </div>
    </div>
  </div>

  <div class="categories-content">
    <p class="categories-status" role="status" aria-live="polite" hidden></p>

    <ul class="categories-list js-categories-list" aria-label="Exercise categories" aria-busy="false"></ul>

    <nav class="categories-pagination" aria-label="Category pages" hidden></nav>
  </div>
</section>
