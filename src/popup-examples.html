<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Popup examples</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <main>
      <ul class="popup-buttons" style="max-width: 768px; margin: 40px auto">
        <li>
          <button
            type="button"
            class="popup-button dark"
            data-show-exercise="64f389465ae26083f39b19d8"
          >
            <span>Side hip abduction</span>
          </button>
        </li>
        <li>
          <button
            type="button"
            class="popup-button dark"
            data-show-exercise="64f389d55ae26083f39b1f75"
          >
            <span
              >Dumbbell seated one arm bicep curl on exercise ball with leg
              raised</span
            >
          </button>
        </li>
        <li>
          <button
            type="button"
            class="popup-button dark"
            data-show-exercise="6502198a45e53ab367c31326"
          >
            <span>Almost Empty</span>
          </button>
        </li>
      </ul>
    </main>

    <load src="./partials/popups.html" />
    <script type="module" src="./ts/popups.ts"></script>
  </body>
</html>
